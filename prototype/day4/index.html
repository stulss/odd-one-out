<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딱 하나 이상함 — Day 4 (콘텐츠)</title>
<!--
  Day 4 — 콘텐츠
  ※ 재구성 데모입니다.

  Day 3에서 추가된 것
   + 차이 축 3~4종 → **10종** (색조·밝기·크기·회전·모서리·투명도·위치·기울기·채도·두께)
   + 도형 4종 (사각/원/마름모/육각)
   + 키보드 조작: 방향키 이동 + Enter 선택   ← 마우스 없이 완주 가능
   + 공정성 검증(지각 임계값) — delta가 너무 작아지면 강제로 키운다

  목표: 연속 10판을 해도 "같은 문제 반복"이라는 느낌이 들지 않을 것
  아직 없는 것: 저장, 오늘의 문제, 공유, 소리, 설정
-->
<style>
:root{--bg:#0E1116;--soft:#161B22;--line:#232A34;--ink:#E8EDF4;--dim:#8A94A6;--faint:#5A6272;
      --brand:#5EE6C5;--warn:#FFB454;--bad:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;height:100%}
body{background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;
  font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;display:grid;grid-template-rows:auto 1fr auto;height:100dvh;max-width:720px;
  margin:0 auto;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
#track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
#fill{height:100%;background:var(--brand);transform-origin:left}
#fill.warn{background:var(--warn)}
#row{display:flex;align-items:center;gap:10px;margin-top:8px;font-variant-numeric:tabular-nums}
#row .k{color:var(--faint);font-size:12px;letter-spacing:.06em}
#row b{font-size:20px}#row .sp{margin-left:auto}
.icon{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--dim)}
#area{display:grid;place-items:center;min-height:0}
#board{display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:8px}
.cell{width:100%;height:100%;border-radius:18%;background:hsl(var(--hue,224) 62% 58%);
  transition:transform .12s ease,background .12s linear}
.cell.s-circle{border-radius:50%}
.cell.s-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0}
.cell.s-hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border-radius:0}
.cell:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.cell.ok{animation:pop .22s ease}
.cell.no{animation:shake .22s ease;background:var(--bad)!important}
.cell.ans{outline:3px solid var(--brand);outline-offset:4px}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#info{font-size:12.5px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:8px}
#info b{color:var(--dim)}#status{color:var(--brand)}
.ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(14,17,22,.94)}
#app[data-s="TITLE"] #ovTitle,#app[data-s="PAUSE"] #ovPause,#app[data-s="RESULT"] #ovResult{display:flex}
h1{font-size:30px}.sub{color:var(--dim);font-size:14px}
.rules{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:13.5px;color:var(--dim);text-align:left;max-width:340px;line-height:1.8}
.rules b{color:var(--ink)}
.btn{min-width:240px;padding:15px 20px;border-radius:14px;font-weight:700;background:var(--brand);color:#08221C}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.big{font-size:76px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app" data-s="TITLE">
  <header>
    <div id="track"><div id="fill"></div></div>
    <div id="row"><span class="k">STAGE</span><b id="stage">1</b>
      <span class="k">SCORE</span><b id="score">0</b>
      <span class="sp"><button class="icon" id="bPause" type="button" aria-label="일시정지">❙❙</button></span></div>
  </header>
  <main id="area"><div id="board" role="group" aria-label="도형 격자"></div></main>
  <footer id="info">
    <div><b>규칙</b> 여러 개 중 딱 하나만 다릅니다. 제한 시간 안에 찾으세요. 오답은 시간 1초 차감.</div>
    <div><b>조작</b> 클릭·터치 · 방향키로 이동 후 Enter · P 또는 Esc로 일시정지</div>
    <div id="status">상태: 대기 중 · 단계 1</div>
  </footer>
  <section class="ov" id="ovTitle">
    <h1>딱 하나 이상함</h1>
    <div class="rules"><b>여러 개 중 딱 하나만 다릅니다.</b><br>제한 시간 안에 찾아 누르세요.<br>
      차이는 색·크기·회전·기울기 등 <b>10가지</b> 중 하나입니다.</div>
    <button class="btn" id="bStart" type="button">▶ 시작하기</button>
  </section>
  <section class="ov" id="ovPause">
    <h1>일시정지</h1><div class="sub">타이머가 멈췄습니다.</div>
    <button class="btn" id="bResume" type="button">계속하기</button>
    <button class="btn g" id="bHome" type="button">처음으로</button>
  </section>
  <section class="ov" id="ovResult">
    <div class="sub" id="rTitle">실패 — 시간 초과</div>
    <div class="big" id="rStage">0</div><div class="sub">단계</div>
    <div class="sub" id="rScore"></div>
    <button class="btn" id="bAgain" type="button">🔁 다시 하기</button>
    <button class="btn g" id="bHome2" type="button">처음으로</button>
  </section>
</div>

<script>
function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;};}
function mulberry32(a){return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rngFor=(k,n)=>mulberry32(xmur3(k+'#'+n)());

const KEY='DAY4', TUNE_T=4.4;

// ★ Day 4 핵심: 차이 축 10종. min은 "이보다 작으면 사람이 못 알아본다"는 지각 임계값.
const AXES={
  hue:    {e:40,h:6,  min:5,  f:d=>`filter:hue-rotate(${d}deg)`},
  light:  {e:24,h:5,  min:4,  f:d=>`filter:brightness(${100+d}%)`},
  size:   {e:18,h:3.5,min:3,  f:d=>`scale:${(1+d/100).toFixed(3)}`},
  rotate: {e:20,h:3,  min:2.5,f:d=>`rotate:${d.toFixed(2)}deg`},
  radius: {e:38,h:8,  min:6,  f:d=>`border-radius:${Math.max(0,40-d)}%`},
  opacity:{e:26,h:7,  min:6,  f:d=>`opacity:${(1-d/100).toFixed(3)}`},
  offset: {e:9, h:2,  min:1.5,f:d=>`translate:${d.toFixed(2)}px 0`},
  skew:   {e:12,h:2.5,min:2,  f:d=>`transform:skewX(${d.toFixed(2)}deg)`},
  sat:    {e:60,h:14, min:12, f:d=>`filter:saturate(${100-d}%)`},
  inset:  {e:10,h:2,  min:1.5,f:d=>`box-shadow:inset 0 0 0 ${d.toFixed(1)}px #0E1116`},
};
const IDS=Object.keys(AXES);
const SHAPES=['square','circle','diamond','hexagon'];
const GRIDS=[[2,3],[2,3],[3,3],[3,4],[3,4],[4,4],[4,4],[4,5],[4,5],[4,6]];
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id), app=$('app'), board=$('board');

const pool=Array.from({length:24},(_,i)=>{const e=document.createElement('button');
  e.className='cell';e.type='button';e.dataset.i=i;e.setAttribute('aria-label','칸 '+(i+1));
  board.appendChild(e);return e;});

let n=1,score=0,combo=0,stage=null,prev=-1,locked=false,focusI=0;
let deadline=0,remain=0,running=false,paused=false,raf=null;

const setScreen=s=>{app.dataset.s=s;status();}, screen=()=>app.dataset.s;
function status(){const m={TITLE:'대기 중',PLAY:'진행 중',PAUSE:'일시정지',RESULT:'종료'};
  $('status').textContent=`상태: ${m[screen()]} · 단계 ${n} · 난이도 T=${TUNE_T}`;}

function makeStage(no){
  const r=rngFor(KEY,no), t=Math.min((no-1)/40,1), ease=t*t*(3-2*t);
  const [c,rows]=GRIDS[Math.min(no-1,GRIDS.length-1)], total=c*rows;
  const id=IDS[Math.floor(r()*IDS.length)], ax=AXES[id];
  let delta=lerp(ax.e,ax.h,ease)*(0.85+r()*0.3);
  delta=Math.max(delta,ax.min);                       // 공정성 검증
  let ans=Math.floor(r()*total); if(ans===prev&&total>1) ans=(ans+1)%total; prev=ans;
  return {no,c,rows,total,ans,id,ax,delta,shape:SHAPES[Math.floor(r()*SHAPES.length)],
          hue:Math.floor(r()*360),time:Math.max(1.6,6.0-ease*TUNE_T)+(total>16?0.5:0)};
}

function layout(){
  if(!stage)return;
  const maxW=Math.min(innerWidth*0.92,560), maxH=Math.max(160,$('area').clientHeight-8);
  const cell=Math.floor(Math.min((maxW-8*(stage.c-1))/stage.c,(maxH-8*(stage.rows-1))/stage.rows));
  board.style.width=(cell*stage.c+8*(stage.c-1))+'px';
  board.style.height=(cell*stage.rows+8*(stage.rows-1))+'px';
}
addEventListener('resize',layout);

function render(s){
  board.style.setProperty('--c',s.c); board.style.setProperty('--r',s.rows); focusI=0;
  for(let i=0;i<24;i++){const e=pool[i];
    if(i>=s.total){e.hidden=true;continue;}
    e.hidden=false; e.className='cell s-'+s.shape;
    e.style.cssText=`--hue:${s.hue};`+(i===s.ans?s.ax.f(s.delta):'');}
  $('stage').textContent=s.no; layout();
}

function startTimer(sec){deadline=performance.now()+sec*1000;running=true;paused=false;if(!raf)loop();}
function loop(){raf=requestAnimationFrame(loop); if(!running||paused)return;
  const left=(deadline-performance.now())/1000, ratio=Math.max(0,left/stage.time);
  $('fill').style.transform='scaleX('+ratio+')'; $('fill').classList.toggle('warn',ratio<0.3);
  if(left<=0){running=false;over();}}
function pause(){if(!running||paused)return;paused=true;remain=deadline-performance.now();setScreen('PAUSE');}
function resume(){if(!running||!paused)return;paused=false;deadline=performance.now()+remain;setScreen('PLAY');}
function toggle(){screen()==='PLAY'?pause():screen()==='PAUSE'?resume():0;}

function next(){stage=makeStage(n);render(stage);startTimer(stage.time);status();}
function newGame(){n=1;score=0;combo=0;prev=-1;$('score').textContent=0;
  pool.forEach(e=>e.classList.remove('ans'));setScreen('PLAY');next();}
function over(){running=false;pool[stage.ans]?.classList.add('ans');
  $('rStage').textContent=n-1;$('rScore').textContent=score.toLocaleString('ko-KR')+'점';setScreen('RESULT');}

function select(i){
  if(locked||screen()!=='PLAY')return;
  locked=true;setTimeout(()=>locked=false,120);
  const c=pool[i];
  if(i===stage.ans){
    const el=stage.time-Math.max(0,(deadline-performance.now())/1000); combo++;
    score+=Math.round(100*(stage.total/12)*(0.4+Math.max(0.1,1-el/stage.time)*0.6)*(1+Math.min(combo,10)*0.1));
    $('score').textContent=score.toLocaleString('ko-KR');
    c.classList.add('ok'); n++; next();
  }else{combo=0;c.classList.add('no');setTimeout(()=>c.classList.remove('no'),260);deadline-=1000;}
}

board.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.cell'); if(!c||c.hidden)return; select(Number(c.dataset.i));
},{passive:true});
board.addEventListener('focusin',e=>{const i=Number(e.target?.dataset?.i);if(Number.isInteger(i))focusI=i;});

// ★ Day 4 핵심: 키보드만으로 완주 가능
function move(key){
  if(!stage||screen()!=='PLAY')return;
  const {c,total}=stage; let i=focusI;
  if(key==='ArrowRight')i=(i+1)%total; else if(key==='ArrowLeft')i=(i-1+total)%total;
  else if(key==='ArrowDown')i=(i+c)%total; else if(key==='ArrowUp')i=(i-c+total)%total;
  focusI=i; pool[i].focus();
}
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();toggle();return;}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList?.contains('cell')){
    e.preventDefault();select(focusI);return;}
  if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key);}
});

$('bStart').onclick=newGame;$('bAgain').onclick=newGame;$('bPause').onclick=toggle;$('bResume').onclick=resume;
$('bHome').onclick=$('bHome2').onclick=()=>{running=false;n=1;setScreen('TITLE');};
setScreen('TITLE');
</script>
</body>
</html>
