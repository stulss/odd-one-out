<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딱 하나 이상함 — Day 2 (게임 로직)</title>
<!--
  Day 2 — 게임 로직
  ※ 재구성 데모입니다. 실제 그날의 코드가 아니라 "이 단계에서 무엇이 늘었는지"를 보여주는 파일입니다.

  Day 1에서 추가된 것
   + 시드 기반 난수 (같은 시드 = 같은 문제, Math.random() 제거)
   + 제한 시간 · 타이머 게이지
   + 점수 · 콤보
   + 게임 오버 / 다시 하기  ← 여기서 처음으로 "한 판"이 성립한다
   + 오답 시 시간 1초 차감 (즉사 아님)

  아직 없는 것: 화면 전환, 색, 소리, 저장, 공유, 키보드, 일시정지
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#111418;color:#8A94A6;padding:16px;
    font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #bar{width:min(92vw,420px);height:6px;background:#232A34;border-radius:99px;overflow:hidden}
  #fill{height:100%;background:#8A94A6;transform-origin:left}
  #fill.warn{background:#FFB454}
  #hud{font-variant-numeric:tabular-nums}
  #hud b{color:#E8EDF4;font-size:20px}
  #board{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px}
  .cell{all:unset;aspect-ratio:1;width:100%;background:#8A94A6;border-radius:14%;
    cursor:pointer;touch-action:manipulation}
  .cell[hidden]{display:none}
  .cell.bad{background:#FF6B6B}
  #over{text-align:center;display:none}
  #over.on{display:block}
  button.go{all:unset;margin-top:10px;padding:13px 26px;border-radius:12px;background:#5EE6C5;
    color:#08221C;font-weight:700;cursor:pointer}
  #note{font-size:12px;color:#5A6272;text-align:center}
</style>
</head>
<body>

<div id="bar"><div id="fill"></div></div>
<div id="hud">STAGE <b id="stage">1</b> · SCORE <b id="score">0</b></div>
<div id="board"></div>
<div id="over">
  <div>시간 초과 — <b id="final">0</b>단계</div>
  <button class="go" id="again" type="button">다시 하기</button>
</div>
<div id="note">Day 2 재구성 데모 · 시드 <span id="seed"></span> — 같은 시드는 항상 같은 문제</div>

<script>
// ── 시드 난수 ──────────────────────────────────────────────
function xmur3(str){let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;};}
function mulberry32(a){return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rngFor=(key,n)=>mulberry32(xmur3(key+'#'+n)());

// ── 설정 ───────────────────────────────────────────────────
const KEY = new URLSearchParams(location.search).get('s') || 'DAY2';
const TUNE_T = 4.4;
const AXES = [
  {id:'rotate',easy:20,hard:3,   f:d=>`rotate:${d}deg`},
  {id:'size',  easy:18,hard:3.5, f:d=>`scale:${1+d/100}`},
  {id:'light', easy:24,hard:5,   f:d=>`filter:brightness(${100+d}%)`},
];
const GRIDS=[[2,3],[2,3],[3,3],[3,4],[3,4],[4,4],[4,4],[4,5],[4,5],[4,6]];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;

const $=id=>document.getElementById(id);
const board=$('board');
const pool=Array.from({length:24},(_,i)=>{const e=document.createElement('button');
  e.className='cell';e.type='button';e.dataset.i=i;board.appendChild(e);return e;});
$('seed').textContent=KEY;

let n=1, score=0, combo=0, stage=null, prev=-1, locked=false;
let deadline=0, running=false, raf=null;

function makeStage(no){
  const r=rngFor(KEY,no);
  const t=Math.min((no-1)/40,1), ease=t*t*(3-2*t);
  const [c,rows]=GRIDS[Math.min(no-1,GRIDS.length-1)];
  const total=c*rows;
  const ax=AXES[Math.floor(r()*AXES.length)];
  const delta=Math.max(2.5, lerp(ax.easy,ax.hard,ease)*(0.85+r()*0.3));
  const time=Math.max(1.6, 6.0-ease*TUNE_T)+(total>16?0.5:0);
  let ans=Math.floor(r()*total);
  if(ans===prev&&total>1) ans=(ans+1)%total;
  prev=ans;
  return {no,c,rows,total,ans,ax,delta,time};
}

function render(s){
  board.style.setProperty('--c',s.c);
  for(let i=0;i<24;i++){
    const e=pool[i];
    if(i>=s.total){e.hidden=true;continue;}
    e.hidden=false; e.classList.remove('bad');
    e.style.cssText = (i===s.ans)? s.ax.f(s.delta) : '';
  }
  $('stage').textContent=s.no;
}

// ── 타이머: rAF 루프는 하나만 돌린다 ────────────────────────
function startTimer(sec){ deadline=performance.now()+sec*1000; running=true; if(!raf) loop(); }
function loop(){
  raf=requestAnimationFrame(loop);
  if(!running) return;
  const left=(deadline-performance.now())/1000;
  const ratio=Math.max(0,left/stage.time);
  $('fill').style.transform='scaleX('+ratio+')';
  $('fill').classList.toggle('warn',ratio<0.3);
  if(left<=0){ running=false; gameOver(); }
}

function next(){ stage=makeStage(n); render(stage); startTimer(stage.time); }

function newGame(){
  n=1; score=0; combo=0; prev=-1;
  $('score').textContent=0; $('over').classList.remove('on'); board.style.display='grid';
  next();
}

function gameOver(){
  running=false;
  $('final').textContent=n-1;
  $('over').classList.add('on');
  board.style.display='none';
}

board.addEventListener('pointerdown',e=>{
  const cell=e.target.closest('.cell');
  if(!cell||cell.hidden||locked||!running) return;
  locked=true; setTimeout(()=>locked=false,120);
  const i=Number(cell.dataset.i);
  if(i===stage.ans){
    const elapsed=stage.time-Math.max(0,(deadline-performance.now())/1000);
    combo++;
    score+=Math.round(100*(stage.total/12)*(0.4+Math.max(0.1,1-elapsed/stage.time)*0.6)*(1+Math.min(combo,10)*0.1));
    $('score').textContent=score.toLocaleString('ko-KR');
    n++; next();
  } else {
    combo=0; cell.classList.add('bad'); setTimeout(()=>cell.classList.remove('bad'),200);
    deadline-=1000;                       // 오답 = 시간 1초 차감 (즉사 아님)
  }
},{passive:true});

$('again').addEventListener('click',newGame);
newGame();
</script>
</body>
</html>
