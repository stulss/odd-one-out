<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딱 하나 이상함 — STEP 2</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ overflow-x:hidden; height:100% }
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:16px;
    background:#111418; color:#8A94A6;
    font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #track{ width:min(92vw,520px); height:6px; background:#232A34; border-radius:99px; overflow:hidden }
  #fill{ height:100%; background:#8A94A6; transform-origin:left }
  #fill.warn{ background:#FFB454 }

  #hud{ font-variant-numeric:tabular-nums }
  #hud b{ color:#E8EDF4; font-size:22px }

  #board{
    display:grid;
    grid-template-columns:repeat(var(--cols,2), 1fr);
    grid-template-rows:repeat(var(--rows,3), 1fr);
    gap:8px;
  }
  #board[hidden]{ display:none }
  .cell{
    all:unset; width:100%; height:100%;
    background:#8A94A6; border-radius:16%;
    cursor:pointer; touch-action:manipulation;
  }
  .cell[hidden]{ display:none }
  .cell.wrong{ background:#FF6B6B }
  .cell.answer{ outline:3px solid #5EE6C5; outline-offset:4px }

  #over{ text-align:center }
  #over[hidden]{ display:none }
  #over .big{ color:#E8EDF4; font-size:56px; font-weight:800; line-height:1.1 }
  button.go{
    all:unset; margin-top:12px; padding:14px 28px; border-radius:12px;
    background:#5EE6C5; color:#08221C; font-weight:700; cursor:pointer;
  }
  #note{ font-size:12.5px; color:#5A6272; text-align:center; max-width:min(92vw,520px) }
</style>
</head>
<body>

<div id="track"><div id="fill"></div></div>
<div id="hud">STAGE <b id="stage">1</b> · SCORE <b id="points">0</b> · <span id="msg">다른 하나를 찾아 누르세요</span></div>

<div id="board" role="group" aria-label="도형 격자"></div>

<div id="over" hidden>
  <div>시간 초과</div>
  <div class="big"><span id="finalStage">0</span>단계</div>
  <div><span id="finalPoints">0</span>점</div>
  <button class="go" id="again" type="button">다시 하기</button>
</div>

<div id="note">STEP 2 — 시드 <b id="seed"></b> · 같은 시드는 언제 열어도 같은 문제입니다.
  <br>주소 뒤에 <code>?s=ABC</code>를 붙이면 다른 문제를 볼 수 있습니다.</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
